h1{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:8px 0}h2{font-size:20px;margin:0}h3{font-size:17px;margin:0 0 14px}

.info-msg{padding:14px 0;border-bottom:1px solid var(--line)}.info-msg:last-child{border:0}.info-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.info-msg p{white-space:pre-wrap;margin:7px 0}.info-msg small{color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);background:#111e29}.table tr:last-child td{border-bottom:0}.nick{font-weight:750}.level{color:#8ec8ff}.count{font-weight:800}.count.ok{color:var(--green)}.count.warn{color:var(--gold)}.count.bad{color:var(--red)}.inactive-row{opacity:.48}.badge-inactive{font-size:10px;color:var(--red);margin-left:7px}.actions{display:flex;gap:5px;flex-wrap:wrap}

.profile-card{display:flex;gap:22px;align-items:flex-start}.profile-avatar{width:62px;height:62px;border-radius:18px;background:#1a3c55;display:grid;place-items:center;font-size:27px;font-weight:900;color:#9ed0ff}.profile-info{flex:1}.profile-row{padding:8px 0;border-bottom:1px solid var(--line)}.profile-row:last-child{border:0}.profile-val{margin-top:3px;font-weight:650}.role-badge{display:inline-block;padding:4px 8px;border-radius:7px;background:#1b3446;color:#9ed0ff;margin:2px 4px 2px 0}
.account-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.account-row:last-child{border:0}.account-row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.form-row{display:flex;flex-direction:column;gap:6px;margin:12px 0}.form-row label{font-size:13px;color:#b7c7d2}.form-row input,.form-row textarea,.form-row select,.modal input:not([type=checkbox]),.modal textarea,.modal select{width:100%;background:#09131c;color:var(--text);border:1px solid #304555;border-radius:9px;padding:10px 11px;outline:none}.form-row input:focus,.form-row textarea:focus,.modal input:focus,.modal textarea:focus{border-color:var(--blue)}textarea{resize:vertical;min-height:90px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.form-row.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;overflow:auto}.modal{width:min(100%,520px);max-height:90vh;overflow:auto;background:#111d28;border:1px solid #34495a;border-radius:17px;padding:22px;box-shadow:0 20px 80px #0009}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:13px;color:var(--muted)}.error{color:#ff8995;font-size:13px;min-height:18px}.role-cb-row{display:flex;align-items:center;gap:9px;padding:7px 0;color:#cbd7df}.login-logo{text-align:center;font-size:24px;font-weight:900;letter-spacing:.08em}.live{color:#54b8ff}.russia{color:#f0f4f7}
.toast{position:fixed;z-index:80;bottom:88px;left:50%;transform:translateX(-50%);background:#eaf3fa;color:#10202c;padding:11px 17px;border-radius:10px;box-shadow:0 8px 30px #0008;font-weight:700;max-width:calc(100vw - 30px)}
.bottomnav{position:fixed;z-index:25;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,14,20,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line)}

@media(max-width:650px){.header-inner{padding:10px 13px;align-items:flex-start}.brand{font-size:14px;padding-top:7px}main{padding:18px 13px 100px}.hero{padding:28px 21px}.stats{grid-template-columns:1fr;gap:8px}.stat{padding:14px 17px}.stat strong{font-size:25px}.profile-card{padding:15px;gap:13px}.account-row{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.form-row.full{grid-column:auto}.bottomnav{justify-content:space-around}.nav-item{min-width:0;flex:1}.panel{padding:15px}}

</style>

<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand"><span>LIVE</span> RUSSIA <span>·</span> YALTA</div>
    <div id="authZone"></div>
  </div>
</header>
<main id="app"><div class="empty">Загрузка…</div></main>
<nav id="bottomnav" class="bottomnav" aria-label="Основная навигация"></nav>
<div id="toastRoot" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   НАСТРОЙКА SUPABASE
   ============================================================ */
const SUPABASE_URL = 'https://rmkpevcckejtpkopokhr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6n4DaH1i5cGXS6XWQ2AAtQ_ON63yV59';

let sb = null;
try {
  if (typeof supabase === 'undefined') console.error('Supabase JS не загружен');
  else sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) { console.error('Ошибка Supabase:', e); }

const ROLE_LABELS = {
  panel_admin:  'Админ панели',
  sphere_head:  'Руководитель сферы',
  server_admin: 'Администратор сервера',
  leader:       'Лидер',
  helper:       'Агент поддержки',
};

const SECTION_LABELS = { admins:'Admins', leaders:'Leaders', helpers:'Helpers' };
const SECTION_TITLES = { admins:'Администрация', leaders:'Лидеры', helpers:'Агенты поддержки', main:'Главная', profile:'Профиль' };

// Терминология по разделам
const PERSON_LABEL = {
  admins:  'администратор',
  leaders: 'лидер',
  helpers: 'агент поддержки',
};
const PERSON_LABEL_CAP = {
  admins:  'Администратор',
  leaders: 'Лидер',
  helpers: 'Агент поддержки',
};

let session = null;
let currentView = 'home';
let currentTab = { admins:'list', leaders:'list', helpers:'list' };
let currentAdminTab = 'pending';

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function writeAuditLog(action, details=''){
  if(!sb || !session) return;
  const {error}=await sb.from('logs').insert([{
    staff_name:'—',
    section:'panel',
    type:String(action||'Действие').slice(0,120),
    date:todayStr(),
    reason:String(details||'').slice(0,500),
    issued_by:session.login
  }]);
  if(error) console.warn('Не удалось записать действие в журнал:',error.message);
}

function todayStr(){const d=new Date();const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
function fmt(d){if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:d}
function toast(msg){const el=document.getElementById('toastRoot');el.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(el._t);el._t=setTimeout(()=>el.innerHTML='',2800)}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function saveSession(){try{if(session)localStorage.setItem('lr_acc',JSON.stringify(session));else localStorage.removeItem('lr_acc')}catch(e){}}
function loadSession(){try{const r=localStorage.getItem('lr_acc');return r?JSON.parse(r):null}catch(e){return null}}

/* ============================================================
   ПРАВА
   ============================================================ */
function hasRole(...roles){return !!session && Array.isArray(session.roles) && roles.some(r=>session.roles.includes(r))}
function isPanelAdmin(){return hasRole('panel_admin')}
function isSphereHead(){return hasRole('sphere_head')}
function isServerAdmin(){return hasRole('server_admin')}
function isLeader(){return hasRole('leader')}
function isHelper(){return hasRole('helper')}

function canViewSection(section){
  if(!session)return false;
  if(isPanelAdmin()||isSphereHead()||isServerAdmin())return true;
  if(section==='admins')return false;
  if(section==='leaders')return isLeader();
  if(section==='helpers')return isHelper();
  return false;
}
function canEditList(section){
  if(!session)return false;
  if(section==='admins')return isPanelAdmin();
  return isSphereHead()||isPanelAdmin();
}
function canManageInfo(section){
  if(!session)return false;
  const base = String(section||'').replace(/^shop_/, '');
  if(base==='main'||base==='admins')return isPanelAdmin();
  return isSphereHead()||isPanelAdmin();
}

/* ============================================================
   СЕССИЯ
   ============================================================ */
async function reloadSession(){
  if(!session||!sb)return;
  try {
    const {data,error} = await sb.from('accounts').select('*').eq('id',session.id).maybeSingle();
    if(error) throw error;
    if(data){session=data;saveSession()}
    else {session=null;saveSession()}
  } catch(e) {
    console.error('Не удалось обновить сессию:',e);
  }
}
async function logout(){
  await writeAuditLog('Выход из аккаунта',`Пользователь: ${session?.login||'—'}`);
  session=null;saveSession();
  renderTopbar();showView('home');
  toast('Вы вышли');
}

/* ============================================================
   ВЕРХНЯЯ ПАНЕЛЬ / НИЖНЯЯ НАВИГАЦИЯ
   ============================================================ */
function renderTopbar(){
  const el = document.getElementById('authZone');
  if(session){
    el.innerHTML = `
      <span class="admin-name">${esc(session.login)}</span>
      ${isPanelAdmin()?`<button class="btn small" onclick="showView('admin_panel')">⚙ Админ панель</button>`:''}
      <button class="btn ghost small" onclick="logout()">Выйти</button>
    `;
  } else {
    el.innerHTML = `
      <button class="btn small" onclick="showLogin()">Вход</button>
      <button class="btn primary small" onclick="openRegisterModal()">Регистрация</button>
    `;
  }
}
function renderBottomnav(){
  const items=[
    {key:'home',label:'Главная',icon:'🏠'},
    {key:'admins',label:'Admins',icon:'🛡'},
    {key:'leaders',label:'Leaders',icon:'⭐'},
    {key:'helpers',label:'Helpers',icon:'💬'},
    {key:'profile',label:'Профиль',icon:'👤'},
  ];
  document.getElementById('bottomnav').innerHTML = items.map(i=>`
    <button class="nav-item ${currentView===i.key?'active':''}" onclick="showView('${i.key}')">
      <span class="nav-icon">${i.icon}</span>
      <span>${i.label}</span>
    </button>
  `).join('');
}
function showView(view){
  currentView = view;
  renderTopbar();renderBottomnav();
  window.scrollTo(0,0);
  const app = document.getElementById('app');
  app.innerHTML = '<div class="empty">Загрузка…</div>';
  if(view==='home')renderHome();
  else if(view==='profile')renderProfile();
  else if(view==='admin_panel')renderAdminPanel();
  else renderSection(view);
}

/* ============================================================
   АВТОРИЗАЦИЯ
   ============================================================ */
function showLogin(){
  modal(`
    <div class="login-logo"><span class="live">LIVE</span> <span class="russia">RUSSIA</span></div>
    <h3 style="text-align:center">Вход</h3>
    <p class="hint" style="text-align:center">Для доступа к панели</p>
    <form onsubmit="event.preventDefault();doLogin()">
      <div class="form-row"><label>Никнейм</label><input id="loginName" autocomplete="username" required></div>
      <div class="form-row"><label>Пароль</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <div id="loginError" class="error"></div>
      <button type="submit" class="btn primary" id="loginBtn" style="width:100%">Войти</button>
    </form>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button></div>
  `);
  setTimeout(()=>document.getElementById('loginName')?.focus(),60);
}
async function doLogin(){
  const errEl = document.getElementById('loginError');
  errEl.textContent='';
  if(!sb){errEl.textContent='Supabase не инициализирован';return}
  const login=(document.getElementById('loginName').value||'').trim();
  const password=document.getElementById('loginPass').value||'';
  if(!login||!password){errEl.textContent='Заполните все поля';return}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Проверка…';
  try{
    const {data,error}=await sb.from('accounts').select('*').eq('login',login).eq('password',password).limit(1);
    if(error){errEl.textContent='Ошибка: '+error.message;return}
    if(!data||!data.length){errEl.textContent='Неверный логин или пароль';return}
    const acc=data[0];
    if(acc.status==='pending'){errEl.textContent='Заявка ещё на рассмотрении';return}
    if(acc.status==='rejected'){errEl.textContent='Заявка отклонена';return}
    session=acc;saveSession();
    await writeAuditLog('Вход в аккаунт',`Пользователь: ${acc.login}`);
    closeModal();renderTopbar();showView('home');
    toast('Добро пожаловать, '+acc.login);
  }catch(e){errEl.textContent='Ошибка: '+(e.message||e)}
  finally{btn.disabled=false;btn.textContent='Войти'}
}
function openRegisterModal(){
  modal(`
    <h3>Регистрация</h3>
    <p class="hint">Заявка будет отправлена админам панели</p>
    <form onsubmit="event.preventDefault();doRegister()">
      <div class="form-row"><label>Никнейм</label><input id="regLogin" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_.-]+" placeholder="Nickname"></div>
      <div class="form-row"><label>Должность</label><input id="regPosition" required maxlength="60" placeholder="Например: Младший администратор"></div>
      <div class="form-row"><label>Пароль</label><input id="regPassword" type="password" required minlength="6" placeholder="Не менее 6 символов"></div>
      <div id="regError" class="error"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Отправить</button>
      </div>
    </form>
  `);
}
async function doRegister(){
  const errEl=document.getElementById('regError');errEl.textContent='';
  if(!sb){errEl.textContent='Supabase не инициализирован';return}
  const login=(document.getElementById('regLogin').value||'').trim();
  const position=(document.getElementById('regPosition').value||'').trim();
  const password=document.getElementById('regPassword').value||'';
  if(!login||!position||!password){errEl.textContent='Заполните все поля';return}
  if(password.length<6){errEl.textContent='Пароль слишком короткий';return}
  const {data:ex}=await sb.from('accounts').select('id').eq('login',login).limit(1);
  if(ex&&ex.length){errEl.textContent='Такой никнейм уже занят';return}
  const {error}=await sb.from('accounts').insert([{login,position,password,status:'pending',roles:[]}]);
  if(error){errEl.textContent='Ошибка: '+error.message;return}
  closeModal();
  toast('Заявка отправлена');
}

/* ============================================================
   ГЛАВНАЯ
   ============================================================ */
async function renderHome(){
  const app=document.getElementById('app');
  if(!sb){app.innerHTML='<div class="empty"><strong>Нет подключения к базе данных</strong>Проверьте интернет и настройки Supabase, затем обновите страницу.</div>';return}
  const [a,l,h,info]=await Promise.all([
    sb.from('staff').select('*',{count:'exact',head:true}).eq('section','admins').eq('inactive',false),
    sb.from('staff').select('*',{count:'exact',head:true}).eq('section','leaders').eq('inactive',false),
    sb.from('staff').select('*',{count:'exact',head:true}).eq('section','helpers').eq('inactive',false),
    sb.from('info_messages').select('*').eq('section','main').order('created_at',{ascending:false}),
  ]);
  const adminCount=a.count||0, leaderCount=l.count||0, helperCount=h.count||0;
  const infoList=info.data||[];
  const canManage = session && isPanelAdmin();

  app.innerHTML = `
    <section class="hero">
      <div class="eyebrow">Yalta · Live Russia</div>
      <h1>Сервер Ялта</h1>
      <p>Актуальная статистика и информация о сервере</p>
    </section>
    <section class="stats">
      <div class="stat"><label>Агенты поддержки</label><strong>${helperCount}</strong><span>человек на сервере</span></div>
      <div class="stat"><label>Лидеры</label><strong>${leaderCount}</strong><span>человек на сервере</span></div>
      <div class="stat"><label>Администрация</label><strong>${adminCount}</strong><span>человек в составе</span></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <div><div class="eyebrow">Information</div><h2>Информация</h2></div>
        ${canManage?`<button class="btn primary small" onclick="openInfoModal('main')">＋ Добавить</button>`:''}
      </div>
      <div>
        ${infoList.length?infoList.map(m=>`
          <div class="info-msg">
            <div class="info-head">
              <strong>${esc(m.title)}</strong>
              ${canManage?`<button class="btn danger small" onclick="deleteInfo('${m.id}','main')">×</button>`:''}
            </div>
            <p>${esc(m.content)}</p>
            ${m.attachment?`<a href="${esc(m.attachment)}" target="_blank" class="btn small ghost">📎 Вложение</a>`:''}
            <div style="margin-top:6px"><small>${esc(m.author||'—')} · ${fmt(String(m.created_at||'').slice(0,10))}</small></div>
          </div>
        `).join(''):'<div class="empty">Информации пока нет</div>'}
      </div>
    </section>
  `;
}

/* ============================================================
   РАЗДЕЛЫ
   ============================================================ */
function renderSection(section){
  const app=document.getElementById('app');
  if(!session){app.innerHTML=`<div class="empty"><strong>Требуется вход</strong>Войдите или зарегистрируйтесь</div>`;return}
  if(!canViewSection(section)){app.innerHTML=`<div class="empty"><strong>Нет доступа</strong>У вас нет прав для просмотра этого раздела</div>`;return}
  const tab=currentTab[section];
  app.innerHTML=`
    <div class="section-head"><h1>${SECTION_TITLES[section]}</h1><p>Раздел ${SECTION_LABELS[section]}</p></div>
    <div class="tabs">
      <button class="tab ${tab==='list'?'active':''}" onclick="setTab('${section}','list')">📋 Список</button>
      <button class="tab ${tab==='info'?'active':''}" onclick="setTab('${section}','info')">ℹ Информация</button>
    </div>
    <div id="sectionContent"></div>
  `;
  if(tab==='list')renderList(section);
  else renderInfoSection(section);
}
function setTab(section,tab){currentTab[section]=tab;renderSection(section)}

/* ============================================================
   СПИСОК
   ============================================================ */
async function renderList(section){
  const content=document.getElementById('sectionContent');
  if(!sb){content.innerHTML='<div class="empty">Нет подключения к базе данных</div>';return}
  content.innerHTML='<div class="empty">Загрузка…</div>';
  const {data}=await sb.from('staff').select('*').eq('section',section);
  const arr=(data||[]).slice();
  arr.sort((a,b)=>{
    if(a.inactive!==b.inactive)return a.inactive?1:-1;
    return b.level-a.level;
  });
  const editable=canEditList(section);
  const showPromoted=section==='admins';
  const showLevel=section==='admins';
  // Столбец «Уровень» показывается только в списке администрации.
  // «Должность» у admins и leaders; у helpers скрыта.
  const showPosition = section !== 'helpers';
  const positionLabel = section === 'leaders' ? 'Фракция' : 'Должность';
  const addLabel = PERSON_LABEL[section];

  content.innerHTML=`
    ${editable?`<div style="margin-bottom:12px"><button class="btn primary" onclick="openStaffModal('${section}')">＋ Добавить ${addLabel}</button></div>`:''}
    <div class="table-wrap">
      <table class="table">
        <thead><tr>
          <th>Никнейм</th>
          <th>ВКонтакте</th>
          ${showLevel?'<th>Уровень</th>':''}
          ${showPosition?`<th>${positionLabel}</th>`:''}
          <th>Выговоры</th><th>Устные</th><th>Назначен</th>
          ${showPromoted?'<th>Повышение</th>':''}
          ${editable?'<th>Действия</th>':''}
        </tr></thead>
        <tbody>
          ${arr.length?arr.map(s=>staffRow(section,s,editable,showPromoted,showPosition,showLevel)).join(''):'<tr><td colspan="12"><div class="empty">Список пуст</div></td></tr>'}
        </tbody>
      </table>
    </div>
    <div id="sectionSanctionLogs"></div>
  `;
  renderSectionSanctionLogs(section);
}

async function renderSectionSanctionLogs(section){
  const el=document.getElementById('sectionSanctionLogs');
  if(!el)return;
  const {data,error}=await sb.from('logs').select('*').eq('section',section)
    .in('type',['Выговор','Устный выговор','Автоматический выговор','Снятие выговора','Снятие устного','Удаление из состава'])
    .order('date',{ascending:false}).limit(200);
  if(error){el.innerHTML=`<div class="panel"><h2>Логи выговоров</h2><p class="hint">Ошибка загрузки: ${esc(error.message)}</p></div>`;return}
  const rows=data||[];
  el.innerHTML=`<div class="panel">
    <div class="panel-head"><h2>Логи выдачи и снятия выговоров</h2><span class="hint">${SECTION_LABELS[section]}</span></div>
    ${rows.length?rows.map(r=>`<div class="account-row"><div><strong>${esc(r.type)}</strong><small>${esc(r.staff_name||'—')} · ${fmt(r.date)} · ${esc(r.issued_by||'—')}</small>${r.reason?`<small style="white-space:normal">${esc(r.reason)}</small>`:''}</div></div>`).join(''):'<div class="empty">Логов пока нет</div>'}
  </div>`;
}

function staffRow(section,s,editable,showPromoted,showPosition,showLevel){
  return `<tr class="${s.inactive?'inactive-row':''}">
    <td><span class="nick">${esc(s.name)}</span>${s.inactive?'<span class="badge-inactive">НЕАКТИВ</span>':''}</td>
    <td>${s.vk?`<a href="${esc(s.vk)}" target="_blank" rel="noopener noreferrer">Открыть профиль</a>`:'—'}</td>
    ${showLevel?`<td><span class="level">${s.level} уровень</span></td>`:''}
    ${showPosition?`<td>${esc(s.position)}</td>`:''}
    <td><span class="count ${s.warns>=3?'bad':s.warns?'warn':'ok'}">${s.warns}/3</span></td>
    <td><span class="count ${s.oral>=2?'bad':s.oral?'warn':'ok'}">${s.oral}/2</span></td>
    <td>${fmt(s.appointed)}</td>
    ${showPromoted?`<td>${fmt(s.promoted)}</td>`:''}
    ${editable?`<td><div class="actions">
      <button class="btn small" onclick="openSanction('${section}','${s.id}','warn')">Выговор</button>
      <button class="btn small" onclick="openSanction('${section}','${s.id}','oral')">Устный</button>
      <button class="btn small" onclick="openRemoveSanction('${section}','${s.id}')">Снять</button>
      <button class="btn small" onclick="toggleInactive('${s.id}')">${s.inactive?'Актив':'Неактив'}</button>
      <button class="btn small" onclick="openStaffModal('${section}','${s.id}')">✎</button>
      <button class="btn danger small" onclick="deleteStaff('${section}','${s.id}')">×</button>
    </div></td>`:''}
  </tr>`;
}

async function openStaffModal(section,id){
  if(!canEditList(section))return;
  let s;
  if(id){
    const {data}=await sb.from('staff').select('*').eq('id',id).single();
    if(!data){toast('Не найдено');return}
    s=data;
  } else {
    s={name:'',level:1,position:'',vk:'',appointed:todayStr(),promoted:null};
  }
  const showPromoted=section==='admins';
  const showPosition=section!=='helpers';
  const positionLabel = section === 'leaders' ? 'Фракция' : 'Должность';

  modal(`
    <h3>${id?'Изменить':'Добавить'} · ${SECTION_TITLES[section]}</h3>
    <form onsubmit="event.preventDefault();saveStaff('${section}','${id||''}')">
      <div class="form-grid">
        <div class="form-row"><label>Никнейм</label><input id="stName" required value="${esc(s.name)}"></div>
        <div class="form-row"><label>Ссылка на профиль ВКонтакте</label><input id="stVk" type="url" placeholder="https://vk.com/..." value="${esc(s.vk||'')}"></div>
        <div class="form-row"><label>Уровень (1–8)</label><input id="stLevel" type="number" min="1" max="8" required value="${s.level}"></div>
        ${showPosition?`<div class="form-row full"><label>${positionLabel}</label><input id="stPosition" required value="${esc(s.position)}"></div>`:''}
        <div class="form-row"><label>Дата назначения</label><input id="stAppointed" type="date" required value="${String(s.appointed).slice(0,10)}"></div>
        ${showPromoted?`<div class="form-row"><label>Дата повышения</label><input id="stPromoted" type="date" value="${s.promoted?String(s.promoted).slice(0,10):''}"></div>`:''}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Сохранить</button>
      </div>
    </form>
  `);
}

async function saveStaff(section,id){
  if(!canEditList(section))return;
  const showPromoted=section==='admins';
  const showPosition=section!=='helpers';
  const payload={
    section,
    name:document.getElementById('stName').value.trim(),
    vk:(document.getElementById('stVk').value||'').trim()||null,
    level:Math.min(8,Math.max(1,parseInt(document.getElementById('stLevel').value,10)||1)),
    appointed:document.getElementById('stAppointed').value,
  };
  if(showPosition){
    payload.position = document.getElementById('stPosition').value.trim();
  }
  if(showPromoted){
    const pr=document.getElementById('stPromoted')?.value;
    payload.promoted=pr||null;
  }
  let error;
  if(id)({error}=await sb.from('staff').update(payload).eq('id',id));
  else ({error}=await sb.from('staff').insert([payload]));
  if(error){toast('Ошибка: '+error.message);return}
  await writeAuditLog(id?'Изменение сотрудника':'Добавление сотрудника',`${SECTION_TITLES[section]}: ${payload.name}`);
  closeModal();renderList(section);toast('Сохранено');
}

async function deleteStaff(section,id){
  if(!canEditList(section))return;
  if(!confirm('Удалить '+PERSON_LABEL[section]+'?'))return;
  const {error}=await sb.from('staff').delete().eq('id',id);
  if(error){toast('Ошибка: '+error.message);return}
  await writeAuditLog('Удаление сотрудника',`${SECTION_TITLES[section]}: ${id}`);
  renderList(section);toast('Удалено');
}

async function toggleInactive(id){
  const {data:s}=await sb.from('staff').select('*').eq('id',id).single();
  if(!s)return;
  if(!canEditList(s.section)){toast('Нет доступа');return}
  const {error}=await sb.from('staff').update({inactive:!s.inactive}).eq('id',id);
  if(error){toast('Ошибка: '+error.message);return}
  await writeAuditLog(s.inactive?'Возврат сотрудника в актив':'Перевод сотрудника в неактив',`${SECTION_TITLES[s.section]}: ${s.name}`);
  renderList(s.section);
}

/* ============================================================
   ВЗЫСКАНИЯ
   ============================================================ */
async function openSanction(section,id,type){
  if(!canEditList(section))return;
  const {data:s}=await sb.from('staff').select('*').eq('id',id).single();
  if(!s){toast('Не найдено');return}
  const oral=type==='oral';
  const count=oral?s.oral:s.warns;
  const max=oral?2:3;
  if(count>=max){toast('Достигнут максимум');return}
  modal(`
    <h3>${oral?'Устный выговор':'Выговор'}</h3>
    <p class="hint">${PERSON_LABEL_CAP[section]}: <b>${esc(s.name)}</b> · ${count} из ${max}</p>
    ${oral&&count+1>=2?'<p class="hint" style="color:#ffc66d">⚠ При 2/2 устных автоматически начислится +1 обычный выговор.</p>':''}
    <form onsubmit="event.preventDefault();issueSanction('${section}','${id}','${type}')">
      <div class="form-row"><label>Дата</label><input id="sanDate" type="date" required value="${todayStr()}"></div>
      <div class="form-row"><label>Причина</label><textarea id="sanReason" required maxlength="500"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Выдать</button>
      </div>
    </form>
  `);
}

async function issueSanction(section,id,type){
  if(!canEditList(section))return;
  const oral=type==='oral';
  const reason=(document.getElementById('sanReason').value||'').trim();
  const date=document.getElementById('sanDate').value||todayStr();
  if(!reason){toast('Укажите причину');return}
  const {data:s,error:e1}=await sb.from('staff').select('*').eq('id',id).single();
  if(e1||!s){toast('Ошибка чтения');return}

  let newOral=Number(s.oral)||0;
  let newWarns=Number(s.warns)||0;
  let autoWarn=false;

  if(oral){
    if(newOral>=2){toast('Максимум устных');return}
    newOral+=1;
    if(newOral===2){newOral=0;newWarns+=1;autoWarn=true;}
  } else {
    if(newWarns>=3){toast('Максимум выговоров');return}
    newWarns+=1;
  }

  const logs=[{staff_name:s.name,section,type:oral?'Устный выговор':'Выговор',date,reason,issued_by:session.login}];
  if(autoWarn)logs.push({staff_name:s.name,section,type:'Автоматический выговор',date,reason:'Автоначисление при 2/2 устных',issued_by:'system'});

  const willDelete=newWarns>=3;
  if(willDelete){
    logs.push({staff_name:s.name,section,type:'Удаление из состава',date,reason:'Автоудаление при 3/3 выговорах',issued_by:'system'});
    const {error:ed}=await sb.from('staff').delete().eq('id',id);
    if(ed){toast('Ошибка: '+ed.message);return}
  } else {
    const {error:eu}=await sb.from('staff').update({warns:newWarns,oral:newOral}).eq('id',id);
    if(eu){toast('Ошибка: '+eu.message);return}
  }
  const {error:el}=await sb.from('logs').insert(logs);
  if(el){toast('Ошибка журнала: '+el.message);return}
  await writeAuditLog(oral?'Выдача устного выговора':'Выдача выговора',`${s.name}; причина: ${reason}`);
  closeModal();renderList(section);
  toast(willDelete?'Удалён (3/3)':'Взыскание добавлено');
}

async function openRemoveSanction(section,id){
  if(!canEditList(section))return;
  const {data:s}=await sb.from('staff').select('*').eq('id',id).single();
  if(!s){toast('Не найдено');return}
  modal(`
    <h3>Снять взыскание</h3>
    <p class="hint">${PERSON_LABEL_CAP[section]}: <b>${esc(s.name)}</b></p>
    <form onsubmit="event.preventDefault();removeSanction('${section}','${id}')">
      <div class="form-row"><label>Тип</label>
        <select id="rmType">
          <option value="warn" ${s.warns<=0?'disabled':''}>Выговор (${s.warns}/3)</option>
          <option value="oral" ${s.oral<=0?'disabled':''}>Устный (${s.oral}/2)</option>
        </select>
      </div>
      <div class="form-row"><label>Причина</label><textarea id="rmReason" required maxlength="500"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Снять</button>
      </div>
    </form>
  `);
}

async function removeSanction(section,id){
  if(!canEditList(section))return;
  const type=document.getElementById('rmType').value;
  const reason=(document.getElementById('rmReason').value||'').trim();
  if(!reason){toast('Укажите причину');return}
  const {data:s}=await sb.from('staff').select('*').eq('id',id).single();
  if(!s){toast('Не найдено');return}
  const field=type==='oral'?'oral':'warns';
  if((s[field]||0)<=0){toast('Нет взысканий');return}
  const {error}=await sb.from('staff').update({[field]:s[field]-1}).eq('id',id);
  if(error){toast('Ошибка: '+error.message);return}
  await sb.from('logs').insert([{staff_name:s.name,section,type:type==='oral'?'Снятие устного':'Снятие выговора',date:todayStr(),reason,issued_by:session.login}]);
  await writeAuditLog(type==='oral'?'Снятие устного взыскания':'Снятие выговора',`${s.name}; причина: ${reason}`);
  closeModal();renderList(section);toast('Снято');
}

/* ============================================================
   ИНФОРМАЦИЯ (общая и магазинная)
   ============================================================ */
async function renderInfoSection(section){
  const content=document.getElementById('sectionContent');
  if(!sb){content.innerHTML='<div class="empty">Нет подключения к базе данных</div>';return}
  content.innerHTML='<div class="empty">Загрузка…</div>';
  const {data}=await sb.from('info_messages').select('*').eq('section',section).order('created_at',{ascending:false});
  const canManage=canManageInfo(section);
  const list=data||[];
  content.innerHTML=`
    ${canManage?`<div style="margin-bottom:12px"><button class="btn primary" onclick="openInfoModal('${section}')">＋ Добавить</button></div>`:''}
    <div class="panel" style="margin-top:0">
      ${list.length?list.map(m=>`
        <div class="info-msg">
          <div class="info-head">
            <strong>${esc(m.title)}</strong>
            ${canManage?`<button class="btn danger small" onclick="deleteInfo('${m.id}','${section}')">×</button>`:''}
          </div>
          <p>${esc(m.content)}</p>
          ${m.attachment?`<a href="${esc(m.attachment)}" target="_blank" class="btn small ghost">📎 Вложение</a>`:''}
          <div style="margin-top:6px"><small>${esc(m.author||'—')} · ${fmt(String(m.created_at||'').slice(0,10))}</small></div>
        </div>
      `).join(''):'<div class="empty">Информации пока нет</div>'}
    </div>
  `;
}

function openInfoModal(section){
  if(!canManageInfo(section))return;
  const title = `Новая информация · ${SECTION_TITLES[section]||section}`;
  modal(`
    <h3>${title}</h3>
    <form onsubmit="event.preventDefault();saveInfo('${section}')">
      <div class="form-row"><label>Заголовок</label><input id="infoTitle" required maxlength="120"></div>
      <div class="form-row"><label>Текст</label><textarea id="infoContent" required maxlength="3000"></textarea></div>
      <div class="form-row"><label>Ссылка-вложение (необязательно)</label><input id="infoAttachment" type="url" placeholder="https://..."></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Опубликовать</button>
      </div>
    </form>
  `);
}

async function saveInfo(section){
  if(!canManageInfo(section))return;
  const title=document.getElementById('infoTitle').value.trim();
  const content=document.getElementById('infoContent').value.trim();
  const attachment=document.getElementById('infoAttachment').value.trim();
  if(!title||!content){toast('Заполните поля');return}
  const {error}=await sb.from('info_messages').insert([{section,title,content,attachment:attachment||null,author:session.login}]);
  if(error){toast('Ошибка: '+error.message);return}
  closeModal();
  if(section==='main')renderHome();
  else renderInfoSection(section);
  await writeAuditLog('Публикация информации',`${SECTION_TITLES[section]||section}: ${title}`);
  toast('Опубликовано');
}

async function deleteInfo(id,section){
  if(!canManageInfo(section))return;
  if(!confirm('Удалить?'))return;
  const {error}=await sb.from('info_messages').delete().eq('id',id);
  if(error){toast('Ошибка: '+error.message);return}
  if(section==='main')renderHome();
  else renderInfoSection(section);
  await writeAuditLog('Удаление информации',`${SECTION_TITLES[section]||section}; запись ID: ${id}`);
}

    <div class="section-head"><h1>Админ панель</h1><p>Управление аккаунтами и журнал действий</p></div>
    <div class="tabs">
      <button class="tab ${currentAdminTab==='pending'?'active':''}" onclick="setAdminTab('pending')">📥 Заявки</button>
      <button class="tab ${currentAdminTab==='accounts'?'active':''}" onclick="setAdminTab('accounts')">👥 Аккаунты</button>
      <button class="tab ${currentAdminTab==='logs'?'active':''}" onclick="setAdminTab('logs')">📋 Логи действий</button>
    </div>

function setAdminTab(t){currentAdminTab=t;renderAdminPanel()}

async function renderAuditLogs(){
  const el=document.getElementById('adminContent');
  if(!el)return;
  el.innerHTML='<div class="empty">Загрузка журнала…</div>';
  const {data,error}=await sb.from('logs').select('*').order('date',{ascending:false}).limit(500);
  if(error){
    el.innerHTML=`<div class="empty">Не удалось загрузить логи: ${esc(error.message)}</div>`;
    return;
  }
  const rows=data||[];
  el.innerHTML=`<div class="panel" style="margin-top:0">
    <div class="account-row"><strong>Все действия</strong><small>Последние 500 записей</small></div>
    <div class="form-row"><label>Поиск по нику</label><input id="auditSearch" placeholder="Введите ник..." oninput="filterAuditLogs()"></div>
    <div id="auditLogRows">${rows.length?rows.map(r=>`
      <div class="account-row">
        <div style="min-width:0">
          <strong>${esc(r.type||'Действие')}</strong>
          <small>${esc(r.issued_by||'—')} · ${esc(r.section||'—')} · ${fmt(String(r.date||'').slice(0,10))}</small>
          ${r.reason?`<small style="white-space:normal">${esc(r.reason)}</small>`:''}
          ${r.staff_name&&r.staff_name!=='—'?`<small>Сотрудник: ${esc(r.staff_name)}</small>`:''}
        </div>
      </div>
    `).join(''):'<div class="empty">Записей пока нет</div>'}</div>
  </div>`;
}
function filterAuditLogs(){
  const q=(document.getElementById('auditSearch')?.value||'').trim().toLowerCase();
  document.querySelectorAll('#auditLogRows .account-row').forEach(row=>{
    row.style.display=row.textContent.toLowerCase().includes(q)?'':'none';
  });
}

async function renderPending(){
  const el=document.getElementById('adminContent');
  const {data}=await sb.from('accounts').select('*').eq('status','pending').order('created_at');
  const list=data||[];
  if(!list.length){el.innerHTML='<div class="empty">Нет заявок</div>';return}
  el.innerHTML=`<div class="panel" style="margin-top:0">${list.map(a=>`
    <div class="account-row">
      <div>
        <strong>${esc(a.login)}</strong>
        <small>${esc(a.position||'—')} · ${fmt(String(a.created_at||'').slice(0,10))}</small>
      </div>
      <div class="actions">
        <button class="btn small primary" onclick="openApproveModal('${a.id}')">Одобрить</button>
        <button class="btn danger small" onclick="rejectAccount('${a.id}')">Отклонить</button>
      </div>
    </div>
  `).join('')}</div>`;
}

function openApproveModal(id){
  modal(`
    <h3>Одобрить заявку</h3>
    <p class="hint">Выберите до 2 ролей</p>
    <form onsubmit="event.preventDefault();approveAccount('${id}')">
      ${Object.entries(ROLE_LABELS).map(([r,l])=>`
        <label class="role-cb-row">
          <input type="checkbox" class="role-cb" value="${r}">
          <span>${l}</span>
        </label>
      `).join('')}
      <div id="approveErr" class="error"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Одобрить</button>
      </div>
    </form>
  `);
}

async function approveAccount(id){
  const roles=[...document.querySelectorAll('.role-cb:checked')].map(cb=>cb.value);
  const err=document.getElementById('approveErr');
  if(roles.length>2){err.textContent='Максимум 2 роли';return}
  if(!roles.length){err.textContent='Выберите хотя бы одну роль';return}
  const {error}=await sb.from('accounts').update({status:'active',roles}).eq('id',id);
  if(error){err.textContent='Ошибка: '+error.message;return}
  await writeAuditLog('Одобрение аккаунта',`Аккаунт ID: ${id}; роли: ${roles.join(', ')}`);
  closeModal();renderPending();toast('Аккаунт одобрен');
}

async function rejectAccount(id){
  if(!confirm('Отклонить заявку?'))return;
  const {error}=await sb.from('accounts').update({status:'rejected'}).eq('id',id);
  if(error){toast('Ошибка');return}
  await writeAuditLog('Отклонение заявки',`Аккаунт ID: ${id}`);
  renderPending();toast('Заявка отклонена');
}

async function renderAccounts(){
  const el=document.getElementById('adminContent');
  const {data}=await sb.from('accounts').select('*').eq('status','active').order('login');
  const list=data||[];
  if(!list.length){el.innerHTML='<div class="empty">Нет аккаунтов</div>';return}
  el.innerHTML=`<div class="panel" style="margin-top:0">${list.map(a=>`
    <div class="account-row">
      <div>
        <strong>${esc(a.login)}</strong>
        <small>${esc(a.position||'—')} · ${(a.roles||[]).map(r=>ROLE_LABELS[r]||r).join(', ')||'нет ролей'}</small>
      </div>
      <div class="actions">
        <button class="btn small" onclick="openEditAccount('${a.id}')">Изменить</button>
        <button class="btn danger small" onclick="deleteAccount('${a.id}')">×</button>
      </div>
    </div>
  `).join('')}</div>`;
}

async function openEditAccount(id){
  const {data:a}=await sb.from('accounts').select('*').eq('id',id).single();
  if(!a){toast('Не найдено');return}
  modal(`
    <h3>Редактировать</h3>
    <p class="hint">${esc(a.login)}</p>
    <form onsubmit="event.preventDefault();saveAccount('${id}')">
      <div class="form-row"><label>Должность</label><input id="accPos" value="${esc(a.position||'')}"></div>
      <div class="form-row"><label>Роли (до 2)</label>
        ${Object.entries(ROLE_LABELS).map(([r,l])=>`
          <label class="role-cb-row">
            <input type="checkbox" class="acc-role-cb" value="${r}" ${(a.roles||[]).includes(r)?'checked':''}>
            <span>${l}</span>
          </label>
        `).join('')}
      </div>
      <div class="form-row"><label>Новый пароль (пусто — не менять)</label><input id="accPass" type="password" minlength="6"></div>
      <div id="accErr" class="error"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn primary">Сохранить</button>
      </div>
    </form>
  `);
}

async function saveAccount(id){
  const roles=[...document.querySelectorAll('.acc-role-cb:checked')].map(cb=>cb.value);
  const err=document.getElementById('accErr');
  if(roles.length>2){err.textContent='Максимум 2 роли';return}
  const payload={
    position:document.getElementById('accPos').value.trim(),
    roles,
  };
  const pass=document.getElementById('accPass').value;
  if(pass)payload.password=pass;
  const {error}=await sb.from('accounts').update(payload).eq('id',id);
  if(error){err.textContent='Ошибка: '+error.message;return}
  await writeAuditLog('Изменение аккаунта',`Аккаунт ID: ${id}; роли: ${roles.join(', ')}; должность/монеты обновлены${pass?' и пароль изменён':''}`);
  closeModal();renderAccounts();toast('Сохранено');
  if(session&&session.id===id){await reloadSession();renderTopbar()}
}

async function deleteAccount(id){
  if(session&&session.id===id){toast('Нельзя удалить себя');return}
  if(!confirm('Удалить аккаунт?'))return;
  const {error}=await sb.from('accounts').delete().eq('id',id);
  if(error){toast('Ошибка: '+error.message);return}
  await writeAuditLog('Удаление аккаунта',`Аккаунт ID: ${id}`);
  renderAccounts();toast('Удалено');
}

/* ============================================================
   ПРОВЕРКА СХЕМЫ + ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
const REQUIRED_TABLES = ['accounts','staff','info_messages','logs'];

async function checkSchema(){
  if(!sb)return {ok:false, missing:REQUIRED_TABLES, connection:true};
  const missing=[];
  for(const t of REQUIRED_TABLES){
    const {error}=await sb.from(t).select('*',{count:'exact',head:true});
    if(error){
      if(/schema cache|does not exist|not found|could not find the table/i.test(error.message)) missing.push(t);
      else return {ok:false, missing:[], connection:true, message:error.message};
    }
  }
  return {ok:missing.length===0, missing};
}

function showSchemaErrorScreen(missing){
  document.getElementById('app').innerHTML=`
    <div class="empty" style="max-width:640px;margin:40px auto;text-align:left">
      <strong style="font-size:18px;color:#ff8790">⚠ База данных не готова</strong>
      <p style="margin:14px 0 8px">Supabase не видит таблицы:</p>
      <code style="display:block;background:#29161c;padding:10px;border-radius:8px;color:#ffb0b5;margin-bottom:14px">
        ${missing.map(t=>'public.'+t).join('<br>')}
      </code>
      <p style="margin:14px 0 8px"><b>Что делать:</b></p>
      <ol style="padding-left:20px;color:#c6d3dc;line-height:1.9">
        <li>Supabase → <b>SQL Editor</b> → выполни SQL из чата.</li>
        <li>Убедись, что в конце есть <code style="background:#0b1219;padding:2px 6px;border-radius:5px">notify pgrst, 'reload schema';</code></li>
        <li>Подожди 10 секунд → <button class="btn small primary" onclick="location.reload()">Перезагрузить</button></li>
      </ol>
    </div>`;
}

(async function init(){
  session = loadSession();
  if(session) await reloadSession();
  renderTopbar();
  renderBottomnav();
  document.getElementById('app').innerHTML = '<div class="empty">Проверка базы данных…</div>';
  const schema = await checkSchema();
  if(!schema.ok){
    if(schema.connection && !schema.missing.length){
      document.getElementById('app').innerHTML='<div class="empty"><strong>Не удалось подключиться к базе данных</strong>'+esc(schema.message||'Проверьте URL, ключ Supabase, интернет и настройки доступа (RLS).')+'</div>';
    } else showSchemaErrorScreen(schema.missing);
    return;
  }
  showView('home');
})();
</script>
